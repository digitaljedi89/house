<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Matter Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, precise architect's instrument
   IDEA: a drafting console where the live model is the page
   PICTURE: the 3D house fills the stage; tools rail left, inspector right
   COLOUR and TYPE: graphite chrome, warm white model, one blue accent; Orbitron for marks, Share Tech Mono for measurements, Inter for UI
   LAYOUT: top bar / tool rail / stage / inspector; on phones the inspector becomes a bottom sheet */
:root{color-scheme:light dark;
--bg:light-dark(#e9ecef,#0d0f11);--panel:light-dark(#ffffff,#16191d);--panel2:light-dark(#f3f5f7,#1e2227);
--line:light-dark(#dde1e5,#2a2f36);--ink:light-dark(#15181c,#e7e9ec);--mute:light-dark(#66707b,#8c95a0);
--acc:#3b78ff;--accs:light-dark(#e6eeff,#1b2742);--warn:#e5484d;
--plan-bg:light-dark(#fbfaf7,#121519);--plan-wall:light-dark(#23272c,#e4e6e9);--plan-ink:light-dark(#2a2f35,#d5d9de);
--plan-grid:light-dark(rgba(30,40,60,.07),rgba(200,210,230,.05));--plan-grid2:light-dark(rgba(30,40,60,.16),rgba(200,210,230,.12));
--mono:'Share Tech Mono',ui-monospace,monospace;--disp:'Orbitron','Inter',sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:grid;grid-template:"top top top" 54px "tools stage insp" 1fr/60px 1fr 300px;height:100vh;height:100dvh}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;flex:none;margin-right:6px}
.brand svg{width:26px;height:26px}
.brand b{font:800 13px/1 var(--disp);letter-spacing:.06em}
.brand span{font:600 13px/1 var(--disp);color:var(--acc);letter-spacing:.06em}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#floors{display:flex;gap:4px;flex:none}
#floors button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;font:600 11px/1 var(--disp);letter-spacing:.04em;white-space:nowrap}
#floors button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.spacer{flex:1}
.ib{width:36px;height:36px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;display:grid;place-items:center;flex:none}
.ib svg{width:18px;height:18px}
.ib:disabled{opacity:.35;cursor:default}
.sun{display:flex;align-items:center;gap:8px;flex:none;font:12px var(--mono);color:var(--mute)}
.sun input{width:110px;accent-color:var(--acc)}
.sun b{min-width:58px;color:var(--ink);font-weight:400}
#tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;overflow-y:auto}
#tools button{width:44px;height:44px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--mute);position:relative}
#tools button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tools button:hover{background:var(--panel2);color:var(--ink)}
#tools button.on{background:var(--accs);color:var(--acc)}
#tools button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#111;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:20;pointer-events:none}
#tools hr{width:28px;border:0;border-top:1px solid var(--line);margin:4px 0}
#stage{grid-area:stage;position:relative;overflow:hidden;background:#0b0e14}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c2{display:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:12px/1.2 var(--mono);padding:3px 7px;border-radius:5px;background:rgba(12,14,18,.82);color:#fff;white-space:nowrap}
.lbl.room{background:none;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.5);font:600 13px/1.25 Inter,sans-serif}
.lbl.room small{display:block;font:11px var(--mono);opacity:.85}
.lbl.acc{background:var(--acc)}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(12,14,18,.82);color:#e9ecf0;font-size:13px;padding:8px 14px;border-radius:10px;max-width:calc(100% - 24px);text-align:center;pointer-events:none;backdrop-filter:blur(6px)}
#hint kbd{font:12px var(--mono);background:rgba(255,255,255,.14);padding:1px 5px;border-radius:4px}
#hint .typed{font:13px var(--mono);color:#8fb2ff}
#vopts{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
.chip{border:1px solid rgba(255,255,255,.14);background:rgba(12,14,18,.7);color:#d9dde2;border-radius:999px;padding:6px 11px;font-size:12px;backdrop-filter:blur(6px);white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#sub{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
#insp h2{font:800 13px/1.2 var(--disp);letter-spacing:.05em;margin:0 0 4px}
#insp h3{font:600 12px/1 Inter;color:var(--mute);margin:18px 0 8px}
#insp .sub{color:var(--mute);font-size:12px;margin:0 0 12px}
.f{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin:7px 0}
.f>span{color:var(--mute);font-size:13px}
.f input[type=text],.f input:not([type]),.f select,.f input[type=number],.f input[type=email],.f input[type=password]{width:100%;height:36px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:0 10px;font-size:14px}
.f input[data-len]{font-family:var(--mono);font-size:15px}
.f input.bad{border-color:var(--warn);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.f input[type=range]{width:100%;accent-color:var(--acc)}
.f input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--panel2)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;min-height:36px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.del{color:var(--warn)}
.btn.on{background:var(--accs);border-color:var(--acc);color:var(--acc)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:8px;border:2px solid var(--line)}
.sw button.on{border-color:var(--acc)}
.mats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mats button{border:2px solid var(--line);border-radius:8px;height:48px;font-size:11px;font-weight:600;display:flex;align-items:flex-end;padding:4px 6px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);background-size:cover}
.mats button.on{border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:flex;justify-content:space-between;gap:10px;border:0;background:none;padding:8px;border-radius:7px;text-align:left}
.list button:hover{background:var(--panel2)}
.list i{font:normal 13px var(--mono);color:var(--mute);white-space:nowrap}
.tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:10px 8px 0;margin-top:6px;font-weight:600}
.tot i{font:normal 15px var(--mono)}
.note{font-size:12px;color:var(--mute);margin:10px 0}
.kv{font:13px var(--mono);color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(5,7,10,.55);display:grid;place-items:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mw{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mt{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh{font:800 14px var(--disp);letter-spacing:.05em}
.mx{border:0;background:none;width:36px;height:36px;font-size:20px;color:var(--mute)}
.mb{padding:16px;overflow-y:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.mf:empty{display:none}
.mf button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 16px;font-weight:500}
.mf button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.lib h4{font:600 12px Inter;color:var(--mute);margin:14px 0 6px}
.lib h4:first-child{margin-top:0}
.libg{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.libg button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:64px}
.libg button:hover{border-color:var(--acc)}
.libg b{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.libg b em{width:10px;height:10px;border-radius:3px;flex:none}
.libg i{font:normal 11px var(--mono);color:var(--mute)}
.libg img{width:100%;height:70px;object-fit:contain;border-radius:6px;background:repeating-conic-gradient(#8882 0 25%,transparent 0 50%) 0 0/14px 14px}
.libg .add{border-style:dashed;justify-content:center;align-items:center;color:var(--acc);font-weight:600}
.photo-prev{display:grid;place-items:center;min-height:200px;border:1px dashed var(--line);border-radius:10px;background:repeating-conic-gradient(#8882 0 25%,transparent 0 50%) 0 0/16px 16px;margin-bottom:10px;overflow:hidden}
.photo-prev img{max-width:100%;max-height:280px}
.pick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--acc);color:var(--acc);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer}
.pick input{display:none}
textarea{width:100%;min-height:180px;font:12px var(--mono);border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px;color:var(--ink)}
#menu{position:fixed;right:12px;top:58px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:40;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;min-width:220px}
#menu[hidden]{display:none}
#menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px}
#menu button:hover{background:var(--panel2)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px}
#toast{position:fixed;left:50%;top:66px;transform:translateX(-50%) translateY(-10px);background:#111;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.keys kbd{font:12px var(--mono);background:var(--panel2);border:1px solid var(--line);padding:2px 6px;border-radius:5px;justify-self:start}
#cloudBtn{display:flex;align-items:center;gap:7px;height:36px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:0 10px;flex:none;max-width:230px;font-size:12px;font-weight:500}
#cloudBtn svg{width:18px;height:18px;flex:none}
#cloudBtn .dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
#cloudBtn[data-s=saved] .dot{background:#2fb36d}
#cloudBtn[data-s=saving] .dot,#cloudBtn[data-s=pending] .dot,#cloudBtn[data-s=syncing] .dot,#cloudBtn[data-s=choose] .dot{background:#f0a020}
#cloudBtn[data-s=error] .dot,#cloudBtn[data-s=offline] .dot{background:var(--warn)}
#cloudBtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.proj{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2);display:flex;flex-direction:column}
.proj.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.proj img,.proj .ph{width:100%;aspect-ratio:16/10;object-fit:cover;background:#0b0e14;display:block}
.proj .pi{padding:8px 10px;flex:1}
.proj b{display:block;font-size:13px}
.proj i{font:normal 11px var(--mono);color:var(--mute)}
.proj .pa{display:flex;gap:4px;padding:0 8px 8px}
.proj .pa button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px;font-size:12px;min-height:34px}
.prev3d{width:100%;height:280px;border-radius:10px;display:block;touch-action:none}
.err{color:var(--warn);font-size:13px;min-height:1em;margin:6px 0}
@media (max-width:820px){#cloudBtn span{display:none}}
@media (max-width:820px){
 #app{grid-template:"top" 54px "stage" 1fr "tools" 60px "insp" auto/1fr}
 #tools{flex-direction:row;justify-content:flex-start;padding:0 8px;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
 #tools hr{width:0;height:28px;border-top:0;border-left:1px solid var(--line)}
 #tools button[data-tip]:hover::after{display:none}
 #insp{max-height:38vh;border-left:0;border-top:1px solid var(--line)}
 .sun input{width:80px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <div class="brand"><svg viewBox="0 0 32 32" fill="none"><path d="M16 3 28 10v12L16 29 4 22V10z" stroke="#3b78ff" stroke-width="2"/><path d="M16 3v26M4 10l12 7 12-7" stroke="currentColor" stroke-width="1.5" opacity=".6"/></svg><b>DARK MATTER</b><span>HOME</span></div>
  <nav id="floors" aria-label="Floors"></nav>
  <div class="seg" id="viewSeg"><button data-v="3d" class="on">3D</button><button data-v="2d">2D plan</button></div>
  <div class="seg" id="camSeg"><button data-c="orbit" class="on">Orbit</button><button data-c="walk">Walk</button><button data-c="fly">Flyover</button><button data-c="tour">Room tour</button></div>
  <div class="spacer"></div>
  <label class="sun" title="Time of day"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><input id="hour" type="range" min="0" max="24" step="0.25"><b id="hourL"></b></label>
  <button id="cloudBtn" data-s="local" title="Cloud sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/></svg><i class="dot"></i><span id="cloudTxt">Local only</span></button>
  <button class="ib" id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="ib" id="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="ib" id="unitBtn" title="Switch units" style="font:12px var(--mono);width:44px">ft</button>
  <button class="ib" id="menuBtn" title="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
 </header>
 <aside id="tools" aria-label="Tools">
  <button data-t="select" data-tip="Select & move (V)"><svg viewBox="0 0 24 24"><path d="M5 3l13 7.5-5.5 1.8L10 18z"/></svg></button>
  <hr>
  <button data-t="wall" data-tip="Draw walls (W)"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="1"/><path d="M8 9v6M13 9v6"/></svg></button>
  <button data-t="room" data-tip="Room (R)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h7v8"/></svg></button>
  <button data-t="door" data-tip="Door (D)"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V4h9v16"/><path d="M15 4a10 10 0 0 1 5 8"/><circle cx="12.5" cy="12" r=".8"/></svg></button>
  <button data-t="window" data-tip="Window (N)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4v16M4 12h16"/></svg></button>
  <button data-t="closet" data-tip="Closet (C)"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 1 2-2"/><path d="M12 8v1L3 16h18l-9-7"/></svg></button>
  <hr>
  <button data-t="furniture" data-tip="Furniture (F)"><svg viewBox="0 0 24 24"><path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 11h18v6H3zM5 17v2M19 17v2"/></svg></button>
  <button data-t="photo" data-tip="Item from photo (P)"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button data-t="scan" data-tip="Import 3D scan (I)"><svg viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21 4 16.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12 4 7.5"/></svg></button>
  <button data-t="light" data-tip="Light (L)"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
  <hr>
  <button data-t="measure" data-tip="Measure (M)"><svg viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg></button>
 </aside>
 <main id="stage">
  <canvas id="c3"></canvas><canvas id="c2"></canvas>
  <div id="labels"></div>
  <div id="vopts"></div>
  <div id="sub"></div>
  <div id="hint"></div>
 </main>
 <aside id="insp" aria-label="Inspector"></aside>
</div>
<div id="menu" hidden>
 <button data-m="projects">Projects…</button>
 <button data-m="cloud">Cloud sync & account…</button>
 <hr>
 <button data-m="shot">Screenshot</button>
 <button data-m="export">Export project (JSON)</button>
 <button data-m="import">Import project</button>
 <hr>
 <button data-m="sample">Load sample house</button>
 <button data-m="new">New blank project</button>
 <hr>
 <button data-m="help">Shortcuts & tips</button>
</div>
<div id="modal" hidden><div class="mw" role="dialog" aria-modal="true"><div class="mt"><div class="mh"></div><button class="mx" aria-label="Close">×</button></div><div class="mb"></div><div class="mf"></div></div></div>
<div id="toast"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

/* ================= constants & helpers ================= */
const FT=0.3048, IN=0.0254, WALL_T=5*IN, EYE=1.62;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

}

 if(ui.cam==='walk'){const sp=(keys.has('shift')?4:2)*dt;let mx=0,mz=0;
  if(keys.has('w')||keys.has('arrowup'))mz+=1;if(keys.has('s')||keys.has('arrowdown'))mz-=1;if(keys.has('a')||keys.has('arrowleft'))mx-=1;if(keys.has('d')||keys.has('arrowright'))mx+=1;
  if(mx||mz){const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);const nx=camera.position.x+(fx*mz+rx*mx)*sp,nz=camera.position.z+(fz*mz+rz*mx)*sp;
   if(!blocked(nx,nz))camera.position.set(nx,e+EYE,nz);else if(!blocked(nx,camera.position.z))camera.position.x=nx;else if(!blocked(camera.position.x,nz))camera.position.z=nz}
  camera.position.y=e+EYE;camera.rotation.set(pitch,yaw,0,'YXZ')}
 else if(ui.cam==='fly'){flyA+=dt*.12;const bb=bounds(S.cur),R=bb.R*1.9+3;camera.position.set(bb.cx+Math.cos(flyA)*R,e+bb.R*.9+2+Math.sin(flyA*1.7)*bb.R*.25,bb.cz+Math.sin(flyA)*R);camera.lookAt(bb.cx,e+.8,bb.cz)}
 else if(ui.cam==='tour'){const rs=S.rooms.filter(r=>r.floor===S.cur);if(!rs.length)return;tour.t+=dt;if(tour.t>5){tour.t=0;tour.i=(tour.i+1)%rs.length;toast(rs[tour.i].name)}
  const r=rs[tour.i],sz=Math.max(r.w,r.d);posV.set(r.x+r.w/2-sz*.45,e+1.9+sz*.55,r.z+r.d/2+sz*.85);tgtV.set(r.x+r.w/2,e+.7,r.z+r.d/2);const k=1-Math.exp(-dt*1.6);
  camera.position.lerp(posV,k);controls.target.lerp(tgtV,k);camera.lookAt(controls.target)}
}
function blocked(x,z){const R=.22;
 for(const w of S.walls){if(w.floor!==S.cur)continue;if(segDist(w,x,z)>w.t/2+R)continue;const q=proj(w,x,z);
  const thru=S.openings.some(o=>o.wall===w.id&&o.type!=='window'&&q.u>o.off-o.w/2+.08&&q.u<o.off+o.w/2-.08);if(!thru)return true}
 return false}

function segOnRoomEdge(w,r){const mx=(w.x1+w.x2)/2,mz=(w.z1+w.z2)/2;return(Math.abs(mx-r.x)<.03||Math.abs(mx-r.x-r.w)<.03)&&mz>=r.z-.02&&mz<=r.z+r.d+.02||(Math.abs(mz-r.z)<.03||Math.abs(mz-r.z-r.d)<.03)&&mx>=r.x-.02&&mx<=r.x+r.w+.02}

function applyLen(k,v){
 const s=ui.sel,o=getSel();
 if(!o){if(k==='fh')commit(()=>{const f=curF(),old=f.height;f.height=Math.max(1.8,v);S.walls.forEach(w=>{if(w.floor===f.id&&Math.abs(w.h-old)<.01)w.h=f.height})});return}
 commit(()=>{
  if(s.kind==='wall'){if(k==='len'){const I=wallInfo(o),ox=o.x2,oz=o.z2,nx=o.x1+I.ux*Math.max(.1,v),nz=o.z1+I.uz*Math.max(.1,v);
    for(const w of S.walls){if(w.floor!==o.floor)continue;if(near(w.x1,w.z1,ox,oz)){w.x1=nx;w.z1=nz}if(near(w.x2,w.z2,ox,oz)){w.x2=nx;w.z2=nz}}}
   else o[k]=Math.max(k==='t'?.03:.3,v)}
  else if(s.kind==='opening'){const L=wallInfo(get('wall',o.wall)).L;
   if(k==='left')o.off=v+o.w/2;else if(k==='right')o.off=L-v-o.w/2;else if(k==='w'){const l=o.off-o.w/2;o.w=v;o.off=l+v/2}else o[k]=v;clampOpening(o)}
  else if(s.kind==='item'){o[k]=k==='y'?v:Math.max(.02,v)}
 });
}
function applyK(k,v){
 const o=getSel();
 if(k==='fname'){commit(()=>curF().name=v||'Floor');return}
 if(k==='autoLight'){S.set.autoLight=v;save();return}
 if(!o)return;
 commit(()=>{if(k==='rotDeg')o.rot=(+v||0)*Math.PI/180;else if(k==='type'){o.type=v;o.lm=LIGHT_TYPES[v].lm}else o[k]=v;
  if(ui.sel.kind==='opening'&&k==='style'){if(v==='double'&&o.w<1.2)o.w=60*IN;clampOpening(o)}});
}
function delSel(){const s=ui.sel;if(!s)return;commit(()=>{S[LISTS[s.kind]]=S[LISTS[s.kind]].filter(o=>o.id!==s.id);if(s.kind==='wall')S.openings=S.openings.filter(o=>o.wall!==s.id);ui.sel=null})}

function processPhoto(im,removeBg,tol){
 const max=640,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
 const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);const W=c.width,H=c.height;let d=g.getImageData(0,0,W,H);const a=d.data;
 if(removeBg){const ref=[0,0,0];for(const[x,y]of[[0,0],[W-1,0],[0,H-1],[W-1,H-1]]){const i=(y*W+x)*4;ref[0]+=a[i]/4;ref[1]+=a[i+1]/4;ref[2]+=a[i+2]/4}
  const seen=new Uint8Array(W*H),st=[];for(let x=0;x<W;x++)st.push(x,(H-1)*W+x);for(let y=0;y<H;y++)st.push(y*W,y*W+W-1);const T=tol*tol*3;
  while(st.length){const p=st.pop();if(seen[p])continue;seen[p]=1;const i=p*4,dr=a[i]-ref[0],dg=a[i+1]-ref[1],db=a[i+2]-ref[2];if(dr*dr+dg*dg+db*db>T)continue;a[i+3]=0;const x=p%W,y=(p/W)|0;
   if(x>0)st.push(p-1);if(x<W-1)st.push(p+1);if(y>0)st.push(p-W);if(y<H-1)st.push(p+W)}
  g.putImageData(d,0,0)}
 let minx=W,miny=H,maxx=-1,maxy=-1,r=0,gg=0,b=0,n=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(a[i+3]>10){if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;if((x+y)%3===0){r+=a[i];gg+=a[i+1];b+=a[i+2];n++}}}
 let out=c;if(removeBg&&maxx>minx&&maxy>miny){out=document.createElement('canvas');out.width=maxx-minx+1;out.height=maxy-miny+1;out.getContext('2d').drawImage(c,minx,miny,out.width,out.height,0,0,out.width,out.height)}
 const color=n?'#'+new THREE.Color(`rgb(${Math.round(r/n)},${Math.round(gg/n)},${Math.round(b/n)})`).getHexString():'#888888';
 return{url:out.toDataURL(removeBg?'image/png':'image/jpeg',.85),w:out.width,h:out.height,color};
}

/* ================= 3D scans (GLB) ================= */
const DRACO_PATH='https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/';
const idb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('dmh-assets',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('a',mode),rq=fn(t.objectStore('a'));t.oncomplete=()=>res(rq.result);t.onerror=()=>rej(t.error)}));
 return{get:k=>run('readonly',s=>s.get(k)),put:(k,v)=>run('readwrite',s=>s.put(v,k))}})();
let gl_=null;
function gltf(){if(!gl_){gl_=new GLTFLoader();const dr=new DRACOLoader();dr.setDecoderPath(DRACO_PATH);gl_.setDRACOLoader(dr);gl_.setMeshoptDecoder(MeshoptDecoder)}return gl_}
async function parseModel(buf){const r=await gltf().parseAsync(buf,'');return r.scene}
function normModel(src,rx,ry){
 const px=new THREE.Group();px.rotation.x=rx||0;px.add(src);const py=new THREE.Group();py.rotation.y=ry||0;py.add(px);const G=new THREE.Group();G.add(py);
 G.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(py),size=box.getSize(new THREE.Vector3());
 py.position.set(-(box.min.x+box.max.x)/2,-box.min.y,-(box.min.z+box.max.z)/2);
 src.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;o.userData.keep=true;for(const m of[].concat(o.material)){m.userData.cached=true;if(m.map)m.map.userData.cached=true}}});
 [G,py,px].forEach(o=>o.userData.keep=true);
 return{obj:G,size};
}
const blobCache=new Map(),modelTpl=new Map();let missingWarned=false;
function assetBlob(L){
 if(blobCache.has(L.asset))return blobCache.get(L.asset);
 const p=(async()=>{let b=null;try{b=await idb.get(L.asset)}catch(e){}
  if(!b&&L.path&&cloud.sb&&cloud.user){const{data,error}=await cloud.sb.storage.from(BUCKET).download(L.path);if(error)throw error;b=data;try{await idb.put(L.asset,b)}catch(e){}}
  if(!b)throw new Error('missing scan file');return b})();
 blobCache.set(L.asset,p);p.catch(()=>blobCache.delete(L.asset));return p;
}
function getModel(L){
 let m=modelTpl.get(L.id);if(m&&(m.state!=='error'||Date.now()-m.t<20000))return m;
 m={state:'loading'};modelTpl.set(L.id,m);
 assetBlob(L).then(b=>b.arrayBuffer()).then(parseModel).then(sc=>{Object.assign(m,normModel(sc,L.rx,L.ry),{state:'ready'});rebuild()})
  .catch(e=>{console.warn(e);m.state='error';m.t=Date.now();if(!missingWarned){missingWarned=true;toast(cloud.user?'A 3D scan could not be loaded':'A 3D scan is stored on another device. Sign in to sync it')}rebuild()});
 return m;
}

 const body=`<div id="sv" class="photo-prev" style="min-height:260px"><label class="pick">Choose a .glb file<input type="file" id="sf"></label></div>

  const refresh=()=>{const t=normModel(src,rx,ry);holder.clear();holder.add(t.obj);tpl=t;base=t.size.clone().multiplyScalar(unit);cur=base.clone();showDims();
   const md=Math.max(t.size.x,t.size.y,t.size.z)||1;marker.scale.setScalar(md);marker.position.set(0,.002*md,t.size.z/2+.14*md);
   cam.near=md/100;cam.far=md*60;cam.updateProjectionMatrix();cam.position.set(md*1.1,md*.9,md*1.8);oc.target.set(0,t.size.y/2,0);oc.update()};
  $m('#sf').onchange=async e=>{const f=e.target.files[0];if(!f)return;err('');

   if(!pr){const cv=document.createElement('canvas');cv.className='prev3d';$m('#sv').replaceChildren(cv);$m('#sv').style.padding='0';
    pr=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});pr.setPixelRatio(Math.min(devicePixelRatio,2));pr.outputColorSpace=THREE.SRGBColorSpace;pr.toneMapping=THREE.ACESFilmicToneMapping;
    sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x555566,1.4));const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(2,4,3);sc.add(dl);
    cam=new THREE.PerspectiveCamera(40,1,.01,100);oc=new OrbitControls(cam,cv);oc.enableDamping=true;holder=new THREE.Group();sc.add(holder);
    marker=new THREE.Mesh(new THREE.CircleGeometry(.08,3),new THREE.MeshBasicMaterial({color:0x3b78ff,side:THREE.DoubleSide}));marker.rotation.set(-Math.PI/2,0,-Math.PI/2);sc.add(marker);
    const tick=()=>{if(m.hidden||!cv.isConnected){pr.dispose();pr.forceContextLoss();pr=null;return}const w=cv.clientWidth,h=cv.clientHeight;
     if(w&&h){if(cv.width!==Math.round(w*pr.getPixelRatio())||cv.height!==Math.round(h*pr.getPixelRatio()))pr.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();oc.update();pr.render(sc,cam)}requestAnimationFrame(tick)};tick();
    $m('#sbtn').hidden=false;$m('#sfront').hidden=false}

  $m('#sbtn').onclick=e=>{const b=e.target.closest('button');if(!b||!src)return;if(b.dataset.r==='y')ry-=Math.PI/2;else rx=((Math.round(rx/(Math.PI/2))+1)%4)*Math.PI/2;refresh()};

 });

function ago(t){const s=(Date.now()-Date.parse(t))/1000;if(s<60)return'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return new Date(t).toLocaleDateString()}
async function initCloud(){
 const c=sbCfg();if(!c?.url||!c?.key){setStatus('local');return}
 try{setStatus('syncing');const{createClient}=await import(SB_LIB);
  cloud.sb=createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const{data:{session}}=await cloud.sb.auth.getSession();cloud.user=session?.user||null;
  cloud.sb.auth.onAuthStateChange((ev,s)=>{const was=cloud.user?.id;cloud.user=s?.user||null;
   if(cloud.user&&cloud.user.id!==was)setTimeout(onSignedIn,0);
   if(!cloud.user&&was){cloud.projId=null;cloud.projName='';setStatus('signedout')}});
  if(cloud.user)await onSignedIn();else setStatus('signedout');
 }catch(e){console.warn(e);cloud.sb=null;cloud.err=e.message||String(e);setStatus('error')}
}
async function onSignedIn(){
 setStatus('syncing');let cur=null;try{cur=JSON.parse(localStorage.getItem('dmh-proj')||'null')}catch(e){}
 try{
  if(cur?.id&&cur.uid===cloud.user.id){const{data,error}=await cloud.sb.from('projects').select('id,name,updated_at').eq('id',cur.id).maybeSingle();if(error)throw error;
   if(data){cloud.projId=data.id;cloud.projName=data.name;const ct=Date.parse(data.updated_at),lt=S.updated||0;
    if(ct>lt+1000)await openProject(data.id);else if(lt>ct+1000){markDirty();cloudSave()}else setStatus('saved');return}}
  const{data:list,error}=await cloud.sb.from('projects').select('id').limit(1);if(error)throw error;
  if(!list.length){const r=await createProject('My home',S);if(r){cloud.projId=r.id;cloud.projName=r.name;setCur();markDirty();cloudSave();toast('This design is now saved to your account')}return}
  cloud.projId=null;cloud.projName='';setStatus('choose');projectsModal(true);
 }catch(e){console.warn(e);cloud.err=e.message||String(e);setStatus('error');toast('Sync error: '+cloud.err)}
}
function markDirty(){if(!cloud.user||!cloud.projId)return;cloud.dirty=true;cloud.ver++;setStatus('pending');clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudSave,1500)}
function makeThumb(){try{const W=360,H=225,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');let src;
 if(ui.view==='3d'){renderer.render(scene,camera);src=cv3}else{draw2D();src=cv2}const r=Math.max(W/src.width,H/src.height);
 g.drawImage(src,(W-src.width*r)/2,(H-src.height*r)/2,src.width*r,src.height*r);return c.toDataURL('image/jpeg',.72)}catch(e){return null}}
async function uploadPendingAssets(){
 for(const L of S.library){if(L.kind!=='model'||L.path)continue;let b=null;try{b=await idb.get(L.asset)}catch(e){}if(!b)continue;
  const path=`${cloud.user.id}/${L.asset}.glb`;const{error}=await cloud.sb.storage.from(BUCKET).upload(path,b,{upsert:true,contentType:'model/gltf-binary'});if(error)throw error;L.path=path}
}
async function cloudSave(){
 if(!cloud.user||!cloud.projId)return;if(cloud.saving){cloud.again=true;return cloud.saving}
 clearTimeout(cloud.timer);setStatus('saving');const v=cloud.ver;
 cloud.saving=(async()=>{try{await uploadPendingAssets();
   const body={name:cloud.projName,data:S,updated_at:new Date(S.updated||Date.now()).toISOString()};
   if(Date.now()-cloud.thumbAt>60000){const t=makeThumb();if(t){body.thumb=t;cloud.thumbAt=Date.now()}}
   const{error}=await cloud.sb.from('projects').update(body).eq('id',cloud.projId);if(error)throw error;
   if(cloud.ver===v)cloud.dirty=false;setStatus(cloud.dirty?'pending':'saved');try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  catch(e){console.warn(e);cloud.err=e.message||String(e);setStatus(navigator.onLine?'error':'offline');clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudSave,20000)}})();
 await cloud.saving;cloud.saving=null;
 if(cloud.again){cloud.again=false;if(cloud.dirty)await cloudSave()}
}
async function createProject(name,data){const{data:row,error}=await cloud.sb.from('projects').insert({name,data,updated_at:new Date(data.updated||Date.now()).toISOString()}).select('id,name,updated_at').single();
 if(error){toast('Could not create project: '+error.message);return null}return row}
async function openProject(id){
 if(cloud.dirty&&cloud.projId&&cloud.projId!==id)await cloudSave();
 setStatus('syncing');const{data,error}=await cloud.sb.from('projects').select('id,name,data,updated_at').eq('id',id).single();
 if(error){toast('Could not open project: '+error.message);setStatus('error');return false}
 cloud.quiet=true;S=Object.assign(blank(),data.data);S.set=Object.assign(blank().set,S.set||{});S.updated=Date.parse(data.updated_at);
 cloud.projId=data.id;cloud.projName=data.name;setCur();ui.sel=null;ui.draft=null;undoS.length=0;redoS.length=0;
 changed();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloud.quiet=false;cloud.dirty=false;fit3D();fit2D();setStatus('saved');return true;
}
async function newCloudProject(blankP){
 if(cloud.dirty&&cloud.projId)await cloudSave();let data=S;
 if(blankP){data=blank();data.library=S.library;data.unit=S.unit;data.updated=Date.now()}
 const r=await createProject(blankP?'New home':(cloud.projId?cloud.projName+' copy':'My home'),data);if(!r)return;
 if(blankP){await openProject(r.id);setTool('room')}else{cloud.projId=r.id;cloud.projName=r.name;setCur();markDirty();cloudSave();toast('Saved as '+r.name)}
}
async function projectsModal(first){
 if(!cloud.user){cloudModal();return}
 const{data:list,error}=await cloud.sb.from('projects').select('id,name,updated_at,thumb').order('updated_at',{ascending:false});
 if(error){toast('Could not load projects: '+error.message);return}
 const body=`${first?`<p class="note">Your account already has projects. Open one, or keep the design on this device as a new project.</p>`:''}
  ${cloud.projId?`<label class="f"><span>This project</span><input id="pjName" value="${esc(cloud.projName)}"></label>`:''}
  <div class="projs">${list.map(p=>`<div class="proj ${p.id===cloud.projId?'cur':''}">${p.thumb?`<img src="${p.thumb}" alt="">`:`<div class="ph"></div>`}<div class="pi"><b>${esc(p.name)}</b><i>${p.id===cloud.projId?'Open now · ':''}${ago(p.updated_at)}</i></div><div class="pa">${p.id===cloud.projId?'':`<button data-open="${p.id}">Open</button>`}<button data-del="${p.id}">Delete</button></div></div>`).join('')||'<p class="note">No projects yet.</p>'}</div>`;
 modal('Projects',body,[{t:'New blank project',fn:()=>{newCloudProject(true)}},{t:first?'Keep this design as a new project':'Save a copy as new project',pri:true,fn:()=>{newCloudProject(false)}}],(m,close)=>{
  const nm=m.querySelector('#pjName');if(nm)nm.onchange=()=>{cloud.projName=nm.value.trim()||'My home';setCur();markDirty()};
  m.querySelector('.projs').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
   if(b.dataset.open){close(null);await openProject(b.dataset.open);return}
   if(b.dataset.del){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Confirm delete';return}
    const{error}=await cloud.sb.from('projects').delete().eq('id',b.dataset.del);if(error){toast(error.message);return}
    if(b.dataset.del===cloud.projId){cloud.projId=null;cloud.projName='';setCur();setStatus('choose')}projectsModal()}}});
}
async function auth(m,up){
 const e=m.querySelector('#ae').value.trim(),p=m.querySelector('#ap').value,er=m.querySelector('#ce');er.style.color='';er.textContent='';
 if(!e||p.length<6){er.textContent='Enter your email and a password of at least 6 characters';return}
 er.style.color='var(--mute)';er.textContent=up?'Creating account…':'Signing in…';
 const r=up?await cloud.sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}}):await cloud.sb.auth.signInWithPassword({email:e,password:p});
 if(r.error){er.style.color='';er.textContent=r.error.message;return}
 if(up&&!r.data.session){er.style.color='var(--ink)';er.textContent='Check your email to confirm your account, then sign in here.';return}
 m._close(null);toast('Signed in');
}
async function signOut(){if(cloud.dirty)await cloudSave();await cloud.sb.auth.signOut();cloud.projId=null;cloud.projName='';setCur();setStatus('signedout');toast('Signed out. This device keeps a local copy')}
function cloudModal(){
 const c=sbCfg();
 if(!c?.url){modal('Cloud sync',`<p class="note">Connect your Supabase project to save designs and 3D scans to your account and open them on any device.</p>
   <label class="f"><span>Project URL</span><input id="cu" placeholder="https://xxxx.supabase.co" autocomplete="off"></label><label class="f"><span>Anon key</span><input id="ck" placeholder="eyJ…" autocomplete="off"></label>
   <p class="note">Both are in Supabase → Project Settings → API. The anon key is meant for browsers; row-level security keeps each account's data private.</p><p class="err" id="ce"></p>`,
   [{t:'Cancel'},{t:'Connect',pri:true,fn:m=>{const url=m.querySelector('#cu').value.trim().replace(/\/$/,''),key=m.querySelector('#ck').value.trim();
    if(!/^https:\/\/\S+$/.test(url)||key.length<20){m.querySelector('#ce').textContent='Check the URL and key';return false}
    try{localStorage.setItem('dmh-sb',JSON.stringify({url,key}))}catch(e){}initCloud().then(()=>{if(!cloud.user)cloudModal()})}}]);return}
 if(!cloud.sb){modal('Cloud sync',`<p class="err">Sync couldn't start${cloud.err?': '+esc(cloud.err):''}.</p><p class="note">Check your connection and try again.</p>`,
   [...(c.fixed?[]:[{t:'Use a different project',fn:()=>{try{localStorage.removeItem('dmh-sb')}catch(e){}setStatus('local');setTimeout(cloudModal,0)}}]),{t:'Retry',pri:true,fn:()=>{initCloud()}}]);return}
 if(!cloud.user){modal('Sign in',`<p class="note">Sign in to save your designs and 3D scans to your account and pick them up on any device.</p>
   <label class="f"><span>Email</span><input id="ae" type="email" autocomplete="email"></label><label class="f"><span>Password</span><input id="ap" type="password" autocomplete="current-password"></label><p class="err" id="ce"></p>`,
   [{t:'Create account',fn:m=>{auth(m,true);return false}},{t:'Sign in',pri:true,fn:m=>{auth(m,false);return false}}],m=>{m.querySelector('#ap').onkeydown=e=>{if(e.key==='Enter')auth(m,false)}});return}
 modal('Account',`<p>Signed in as <b>${esc(cloud.user.email)}</b></p><p class="note">${ST[cloud.status]}${cloud.projName?` · project “${esc(cloud.projName)}”`:''}${cloud.status==='error'&&cloud.err?`<br><span class="err">${esc(cloud.err)}</span>`:''}</p>
  <p class="note">Changes save to your account a moment after you make them. When you switch back to this tab, it picks up edits from your other devices.</p>`,
  [{t:'Sign out',fn:()=>{signOut()}},{t:'Projects',pri:true,fn:()=>{setTimeout(()=>projectsModal(),0)}}]);
}
$('#cloudBtn').onclick=()=>{if(cloud.status==='choose')projectsModal(true);else cloudModal()};

 if(data&&Date.parse(data.updated_at)>(S.updated||0)+1000){await openProject(cloud.projId);toast('Updated from your other device')}
});

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();dirty2=true}
new ResizeObserver(resize).observe(stage);
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(blank(),JSON.parse(raw));S.set=Object.assign(blank().set,S.set||{})}}catch(e){}
if(!S){sample();setTimeout(()=>toast('A sample house is loaded. Menu → New blank project to start your own'),800)}
sanitize();resize();rebuild();renderTop();renderInsp();setTool('select');setView('3d');updUndo();fit3D();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(ui.view==='3d'){camStep(dt);if(ui.cam==='orbit')controls.update();renderer.render(scene,camera);placeLabels()}
 else if(dirty2){draw2D();dirty2=false}}
requestAnimationFrame(loop);
initCloud();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>dirty2=true);
new MutationObserver(()=>dirty2=true).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
document.fonts?.ready.then(()=>dirty2=true);
